<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link
			rel="alternate"
			type="application/rss+xml"
			title="RSS"
			href="%sveltekit.assets%/rss.xml"
		/>
		<!--
			The theme is applied before the first paint, so a dark-mode reader never
			sees a white flash. This has to be inline and blocking: anything deferred
			runs after the browser has already painted.
		-->
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const theme =
						stored ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
					document.documentElement.dataset.theme = theme;
				} catch {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
