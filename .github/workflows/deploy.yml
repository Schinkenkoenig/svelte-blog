# The only path to production.
#
# A push to main builds the site and publishes it to GitHub Pages. Nothing is
# deployed by hand, so what is live is always exactly what is on main.
#
# Pull requests run the same build without deploying, which is what makes a
# broken post or a type error a review-time problem instead of a live one.

name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The site is served from https://<user>.github.io/<repo>, so every absolute
# path needs that prefix baked in at build time. Drop this once a custom domain
# puts the site at the root.
env:
  BASE_PATH: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # svelte-check runs before the build: a type error in a route should stop
      # the pipeline, not ship as a broken page.
      - run: npm run check

      - run: npm run build

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
