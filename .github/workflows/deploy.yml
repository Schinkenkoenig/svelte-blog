# The only path to production.
#
# A push to main verifies and publishes. Pull requests run the identical
# verification without deploying, which is what makes a broken post or a type
# error a review-time problem instead of a live one.
#
# The verify job runs the same sequence as `pnpm verify` locally, in the same
# order, so "it passed on my machine" means something. Cheapest checks first: a
# formatting slip should not wait on a type check to be reported.

name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The site is served from https://<user>.github.io/<repo>, so every absolute
# path needs that prefix baked in at build time. Drop this once a custom domain
# puts the site at the root (see issue #13).
env:
  BASE_PATH: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the version from package.json's `packageManager` field, so the
      # runner and mise.toml cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      # --frozen-lockfile: CI installs exactly what the lockfile says, and fails
      # if package.json and the lockfile disagree, rather than quietly resolving
      # something new.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
